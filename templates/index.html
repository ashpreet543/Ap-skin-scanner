<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Skin Scanner</title>
<style>body{font-family:sans-serif;background:#fff8f0;padding:20px;text-align:center}.card{background:#fff;padding:20px;border-radius:15px;max-width:400px;margin:auto;box-shadow:0 4px 15px #0001}input,select,button{width:100%;margin:10px 0;padding:12px;border-radius:8px;border:1px solid #ddd}button{background:#ff7a45;color:#fff;border:none;font-weight:bold}#preview{width:100%;border-radius:10px;margin-top:10px;display:none}#resultBox{display:none;margin-top:20px;text-align:left;background:#f9f9f9;padding:15px;border-radius:10px}.score{font-size:32px;font-weight:bold;color:#ff7a45}</style>
</head><body><div class="card"><h2>Glow Analyzer - Live</h2><label>Daily Water?</label><select id="water"><option>1-2L</option><option selected>3-4L</option><option>5L+</option></select><label>Before Photo</label><input type="file" id="before" accept="image/*" onchange="preview()"><img id="preview"><button onclick="uploadNow()">Analyze Karo</button><div id="resultBox"><div class="score" id="glow">--%</div><p><b>Hydration:</b> <span id="hyd"></span></p><p><b>Diet:</b> <span id="diet"></span></p></div></div>
<script>function preview(){let i=document.getElementById('preview');i.src=URL.createObjectURL(document.getElementById('before').files[0]);i.style.display='block'}async function uploadNow(){let f=document.getElementById('before');if(!f.files[0]){alert("Photo pao pehla!");return}let d=new FormData();d.append('before',f.files[0]);d.append('water',document.getElementById('water').value);document.querySelector('button').innerText="Analyzing...";let r=await fetch('/upload',{method:'POST',body:d});let j=await r.json();document.getElementById('resultBox').style.display='block';document.getElementById('glow').innerText=j.glow+"%";document.getElementById('hyd').innerText=j.hydration;document.getElementById('diet').innerText=j.diet_plan;document.querySelector('button').innerText="Analyze Karo"}</script>
</body></html>
